<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page 3</title>
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <main>
      <div class="container">
        <div class="snackbar-container">
          <form class="form">
            <label class="delay-label">
              Delay (ms)
              <input type="number" name="delay" class="delay-input" required />
            </label>

            <fieldset class="fieldset">
              <legend class="state-legend">State</legend>
              <label class="state-label">
                <input
                  type="radio"
                  name="state"
                  value="fulfilled"
                  class="state-input"
                />
                Fulfilled
              </label>
              <label class="state-label">
                <input
                  type="radio"
                  name="state"
                  value="rejected"
                  class="state-input"
                  required
                />
                Rejected
              </label>
            </fieldset>

            <button type="submit" class="sbmt-btn">Create notification</button>
          </form>
        </div>
        <load src="./partials/back-link.html" />
      </div>
    </main>
    <script type="module" src="./js/2-snackbar.js"></script>
  </body>
</html>
