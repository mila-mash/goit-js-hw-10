<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>S-b</title>
    <script type="module" crossorigin src="/goit-js-hw-10/2-snackbar.js"></script>
    <link rel="modulepreload" crossorigin href="/goit-js-hw-10/assets/styles-oCKhwgts.js">
    <link rel="modulepreload" crossorigin href="/goit-js-hw-10/assets/vendor-BZoxUzx5.js">
    <link rel="stylesheet" crossorigin href="/goit-js-hw-10/assets/styles-C6nmn5op.css">
    <link rel="stylesheet" crossorigin href="/goit-js-hw-10/assets/vendor-DRAOUfWK.css">
  </head>
  <body>
    <main>
      <div class="container">
        <div class="snackbar-container">
          <form class="form">
            <label class="delay-label">
              Delay (ms)
              <input type="number" name="delay" class="delay-input" required />
            </label>

            <fieldset class="fieldset">
              <legend class="state-legend">State</legend>
              <label class="state-label">
                <input
                  type="radio"
                  name="state"
                  value="fulfilled"
                  class="state-input"
                />
                Fulfilled
              </label>
              <label class="state-label">
                <input
                  type="radio"
                  name="state"
                  value="rejected"
                  class="state-input"
                  required
                />
                Rejected
              </label>
            </fieldset>

            <button type="submit" class="sbmt-btn">Create notification</button>
          </form>
        </div>
        <a class="back-link" href="./index.html">Go back</a>

      </div>
    </main>
  </body>
</html>
