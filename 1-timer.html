<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Timer</title>
    <script type="module" crossorigin src="/vanilla-app-template/1-timer.js"></script>
    <link rel="modulepreload" crossorigin href="/vanilla-app-template/assets/styles-oCKhwgts.js">
    <link rel="modulepreload" crossorigin href="/vanilla-app-template/assets/vendor-BZoxUzx5.js">
    <link rel="stylesheet" crossorigin href="/vanilla-app-template/assets/styles-C6nmn5op.css">
    <link rel="stylesheet" crossorigin href="/vanilla-app-template/assets/vendor-DRAOUfWK.css">
  </head>
  <body>
    <main>
      <div class="container">
        <div class="timer-container">
          <div class="input-wrapper">
            <input type="text" id="datetime-picker" class="datetime-picker" />
            <button type="button" data-start class="datetime-btn">Start</button>
          </div>

          <div class="timer">
            <div class="field">
              <span class="value" data-days>00</span>
              <span class="label">Days</span>
            </div>
            <div class="field">
              <span class="value" data-hours>00</span>
              <span class="label">Hours</span>
            </div>
            <div class="field">
              <span class="value" data-minutes>00</span>
              <span class="label">Minutes</span>
            </div>
            <div class="field">
              <span class="value" data-seconds>00</span>
              <span class="label">Seconds</span>
            </div>
          </div>
        </div>

        <a class="back-link" href="./index.html">Go back</a>

      </div>
    </main>

  </body>
</html>
